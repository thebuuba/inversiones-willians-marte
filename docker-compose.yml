version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: inversiones-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: inversiones
      POSTGRES_USER: inversiones
      POSTGRES_PASSWORD: inversiones123
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
