name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inversiones_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inversiones_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inversiones_test
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      FRONTEND_URL: http://localhost:3001
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.8.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate operational scripts
        run: node --check scripts/backup-postgres.mjs

      - name: Apply and verify database migrations
        run: |
          pnpm db:migrate:deploy
          pnpm --filter @inversiones/database exec prisma migrate status --schema prisma/schema.prisma

      - name: Build internal packages
        run: |
          pnpm --filter @inversiones/database exec tsc
          pnpm --filter @inversiones/shared build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: End-to-end test
        run: pnpm --filter backend test:e2e --runInBand

      - name: Build
        run: pnpm build

      - name: Build Cloudflare Worker artifacts
        run: |
          pnpm --filter backend worker:build:staging
          pnpm --filter @inversiones/frontend worker:build
