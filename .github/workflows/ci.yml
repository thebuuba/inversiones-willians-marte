name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: inversiones_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inversiones_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/inversiones_test
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
      FRONTEND_URL: http://localhost:3001
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply and verify database migrations
        run: |
          pnpm db:migrate:deploy
          pnpm --filter @inversiones/database exec prisma migrate status --schema prisma/schema.prisma

      - name: Build internal packages
        run: |
          pnpm --filter @inversiones/database exec tsc
          pnpm --filter @inversiones/shared build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: End-to-end test
        run: pnpm --filter backend test:e2e --runInBand

      - name: Build
        run: pnpm build

      - name: Build Cloudflare Worker artifacts
        run: |
          pnpm --filter backend worker:build:staging
          pnpm --filter @inversiones/frontend worker:build
