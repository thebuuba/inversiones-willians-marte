name: Security lockfile regeneration (temporary)

on:
  push:
    branches: [work/iwm-security-deps-20261029]

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.8.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Emit generated lockfile
        run: |
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const rows = readFileSync('pnpm-lock.yaml', 'utf8').split('\n');
          console.log('IWM_LOCK_BEGIN');
          rows.forEach((row, index) => console.log('IWM_LOCK_LINE_' + index + ' ' + row));
          console.log('IWM_LOCK_END ' + rows.length);
          NODE
